name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening);
      # Dependabot keeps the pins current.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
      - name: Audit dependencies (high and above fail the build)
        run: npm audit --audit-level=high
